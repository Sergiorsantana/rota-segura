[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rota-segura"
version = "0.1.0"
description = "Mapeamento de rotas de fuga e estimativa de tempo de evacuação em edifícios"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sérgio Santana" }]
keywords = ["evacuação", "incêndio", "grafos", "dijkstra", "segurança"]
dependencies = [
    "pyyaml>=6.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.27"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5", "fastapi>=0.110"]

[project.scripts]
rotasegura = "rotasegura.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "RUF"]
ignore = ["B008"]  # Query() em parâmetros é o padrão do FastAPI
